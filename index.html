<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallsmith — Per-monitor wallpapers with local AI</title>
<meta name="description" content="A perfect wallpaper for every screen. Local AI upscaling, rotation, scheduled favorites — in ~10 MB of RAM and 0% GPU at idle.">
<style>
:root { --bg:#12141a; --card:#1c2029; --fg:#e8ebf2; --dim:#9aa3b2;
        --acc:#7aa2f7; --ok:#4cc38a; }
* { margin:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg);
       font:16px/1.6 system-ui,'Segoe UI',sans-serif; }
.wrap { max-width:860px; margin:0 auto; padding:24px; }
header { text-align:center; padding:56px 0 32px; }
header img { width:96px; height:96px; border-radius:22%; }
h1 { font-size:2.4rem; margin:16px 0 4px; }
.tag { color:var(--dim); font-size:1.15rem; max-width:560px; margin:0 auto; }
.langbtn { position:fixed; top:14px; right:14px; background:var(--card);
  color:var(--fg); border:1px solid #333a48; border-radius:8px;
  padding:6px 14px; cursor:pointer; font-size:.9rem; }
.cta { display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
       margin:28px 0 8px; }
.cta a { text-decoration:none; padding:12px 22px; border-radius:10px;
         font-weight:600; }
.cta .pro { background:var(--acc); color:#0d1117; }
.cta .free { background:var(--card); color:var(--fg);
             border:1px solid #333a48; }
.note { text-align:center; color:var(--dim); font-size:.85rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
        gap:14px; margin:40px 0; }
.card { background:var(--card); border-radius:14px; padding:20px; }
.card h3 { margin-bottom:6px; font-size:1.05rem; }
.card p { color:var(--dim); font-size:.95rem; }
table { width:100%; border-collapse:collapse; margin:16px 0 40px;
        background:var(--card); border-radius:14px; overflow:hidden; }
th, td { padding:10px 14px; text-align:left; font-size:.95rem; }
th { background:#232838; }
tr + tr td { border-top:1px solid #2a3040; }
td.c { text-align:center; }
h2 { margin:40px 0 8px; font-size:1.5rem; }
.metric { color:var(--ok); font-weight:700; }
footer { color:var(--dim); text-align:center; padding:36px 0 48px;
         font-size:.9rem; }
footer a { color:var(--acc); }
</style>
</head>
<body>
<button class="langbtn" onclick="toggleLang()" id="langbtn">Español</button>
<div class="wrap">

<header>
  <img src="icon.png" alt="Wallsmith">
  <h1>Wallsmith</h1>
  <p class="tag" data-en="A perfect wallpaper for every screen — enhanced by AI on your own machine, in ~10 MB of RAM and 0% GPU at idle."
     data-es="Un fondo perfecto para cada pantalla — mejorado con IA en tu propio equipo, en ~10 MB de RAM y 0% de GPU en reposo."></p>
  <div class="cta">
    <a class="free" href="https://apps.microsoft.com/detail/9PC8949WX924"
       data-en="Get Wallsmith (free)" data-es="Obtener Wallsmith (gratis)"></a>
    <a class="pro" href="https://apps.microsoft.com/detail/9P4RRG2D9MLG"
       data-en="Get Wallsmith Pro" data-es="Obtener Wallsmith Pro"></a>
  </div>
  <p class="note" data-en="Windows 10/11 · Microsoft Store · one-time purchase, no subscription"
     data-es="Windows 10/11 · Microsoft Store · pago único, sin suscripción"></p>
</header>

<div class="grid">
  <div class="card">
    <h3 data-en="🖥️ One folder per screen" data-es="🖥️ Una carpeta por pantalla"></h3>
    <p data-en="Drop an image into a monitor's folder and that screen's wallpaper changes instantly. Hot-plug detection included."
       data-es="Soltá una imagen en la carpeta de un monitor y el fondo de esa pantalla cambia al instante. Detecta monitores al conectarlos."></p>
  </div>
  <div class="card">
    <h3 data-en="✨ Local AI upscaling" data-es="✨ IA local que mejora tus imágenes"></h3>
    <p data-en="Real-ESRGAN super-resolution runs on your own GPU (integrated graphics work too). Your images never leave your machine."
       data-es="Superresolución Real-ESRGAN en tu propia GPU (funciona con gráficos integrados). Tus imágenes nunca salen de tu equipo."></p>
  </div>
  <div class="card">
    <h3 data-en="🪶 Applies and sleeps" data-es="🪶 Aplica y se duerme"></h3>
    <p data-en="No render loop. Measured: 0% GPU and 8–14 MB RAM at idle, versus 12% GPU / 139 MB for animated wallpaper apps."
       data-es="Sin bucle de render. Medido: 0% GPU y 8–14 MB de RAM en reposo, contra 12% GPU / 139 MB de las apps de fondos animados."></p>
  </div>
  <div class="card">
    <h3 data-en="🔒 Zero telemetry" data-es="🔒 Cero telemetría"></h3>
    <p data-en="No accounts, no analytics, no cloud. Everything is plain files you can read and script."
       data-es="Sin cuentas, sin analítica, sin nube. Todo son archivos de texto que podés leer y scriptear."></p>
  </div>
</div>

<h2 data-en="Free vs Pro" data-es="Free vs Pro"></h2>
<table>
  <tr><th data-en="Feature" data-es="Función"></th><th class="c">Free</th><th class="c">Pro</th></tr>
  <tr><td data-en="Managed screens" data-es="Pantallas gestionadas"></td><td class="c" data-en="1 (primary)" data-es="1 (principal)"></td><td class="c metric" data-en="All" data-es="Todas"></td></tr>
  <tr><td data-en="Rotation, playlists, favorites, history" data-es="Rotación, playlists, favoritos, historial"></td><td class="c">✓</td><td class="c">✓</td></tr>
  <tr><td data-en="AI super-resolution (Real-ESRGAN)" data-es="Superresolución IA (Real-ESRGAN)"></td><td class="c">—</td><td class="c metric">✓</td></tr>
  <tr><td data-en="Scheduled favorites (day/night)" data-es="Favoritos programados (día/noche)"></td><td class="c">—</td><td class="c metric">✓</td></tr>
  <tr><td data-en="Panoramic image across all screens" data-es="Panorámica entre todas las pantallas"></td><td class="c">—</td><td class="c metric">✓</td></tr>
</table>

<footer>
  <p>
    <a href="privacy.html" data-en="Privacy policy" data-es="Política de privacidad"></a> ·
    <a href="mailto:paniaguajuanm@gmail.com" data-en="Contact" data-es="Contacto"></a>
  </p>
  <p>© 2026 Juan Paniagua</p>
</footer>

</div>
<script>
let lang = (navigator.language || "en").slice(0, 2) === "es" ? "es" : "en";
function render() {
  document.documentElement.lang = lang;
  document.getElementById("langbtn").textContent =
    lang === "es" ? "English" : "Español";
  document.querySelectorAll("[data-en]").forEach(el => {
    el.textContent = el.dataset[lang];
  });
}
function toggleLang() { lang = lang === "es" ? "en" : "es"; render(); }
render();
</script>
</body>
</html>
